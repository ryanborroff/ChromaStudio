name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: API security regression tests
        run: pnpm --filter @workspace/api-server test

      - name: Production builds
        run: pnpm run build

      - name: Verification worker build and import
        run: |
          pnpm --filter @workspace/api-server build:verification-worker
          DATABASE_URL=postgres://localhost/chroma_build_check node artifacts/api-server/dist/mediaVerificationWorker.mjs
