name: Semgrep

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Explicit registry ruleset is compatible with metrics disabled.
      - name: Run Semgrep
        run: semgrep scan --config=p/owasp-top-ten --error --metrics=off
