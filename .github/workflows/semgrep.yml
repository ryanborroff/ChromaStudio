name: Semgrep

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Explicit registry ruleset is compatible with metrics disabled.
      - name: Run Semgrep
        run: semgrep scan --config=p/owasp-top-ten --error --metrics=off
