openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ChromaStudio - Professional Filmmaker Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: videos
    description: Video hosting operations
  - name: follows
    description: Following system
  - name: feed
    description: Activity feed
  - name: messages
    description: Direct messaging
  - name: stats
    description: Platform stats and aggregates
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-file-url:
    post:
      tags: [Storage]
      operationId: requestFileUploadUrl
      summary: Request a presigned URL for a general file attachment upload
      description: |
        Like request-url but for direct-message file attachments: accepts any
        content type up to a larger size limit. Returns a presigned GCS URL for
        direct upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing/invalid fields or file too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/usage:
    get:
      operationId: getStorageUsage
      tags: [Storage]
      summary: Get the current user's storage usage
      responses:
        "200":
          description: Storage usage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"
        "401":
          description: Authentication required.

  /videos/{id}/export:
    post:
      operationId: requestVideoExport
      tags: [videos]
      summary: Request a direct export URL for an owned video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Direct, provider-hosted export URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoExport"
        "400":
          description: Video is not exportable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Video not found.

  /videos/{id}/editing-export:
    get:
      operationId: downloadEditingExport
      tags: [videos]
      summary: Download an NLE interchange file for an owned video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Final Cut Pro XML interchange file compatible with Final Cut Pro, Premiere Pro, and DaVinci Resolve.
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: Video is not ready for editing export.
        "404":
          description: Video not found.

  /exports:
    post:
      operationId: requestBulkExport
      tags: [videos]
      summary: Create an account, project, or video export job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportJobInput"
      responses:
        "202":
          description: Export job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
    get:
      operationId: listExportJobs
      tags: [videos]
      summary: List the current user's export jobs
      responses:
        "200":
          description: Export jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportJob"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Browse/search filmmakers
      parameters:
        - name: profession
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: skills
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, newest, most_viewed]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /users/{username}:
    get:
      operationId: getUserByUsername
      tags: [users]
      summary: Get a user profile by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  /users/{userId}/endorsements:
    get:
      operationId: listEndorsements
      tags: [users]
      summary: List endorsements for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Endorsements list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndorsementList"
    post:
      operationId: createEndorsement
      tags: [users]
      summary: Write an endorsement for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndorsement"
      responses:
        "201":
          description: Created endorsement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endorsement"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteEndorsement
      tags: [users]
      summary: Remove my endorsement for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  # ── Admin ────────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Admin user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "403":
          description: Forbidden

  /admin/users/{userId}:
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden

  /admin/videos/{videoId}/featured:
    patch:
      operationId: adminToggleFeatured
      tags: [admin]
      summary: Toggle featured status of a video (admin only)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFeaturedToggle"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          description: Forbidden

  # ── Videos ─────────────────────────────────────────────────────────────────
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List/search videos
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: mine
          in: query
          description: When true, returns the authenticated user's own videos (including private).
          schema:
            type: boolean
        - name: collectionId
          in: query
          description: Filter by collection id, or "none" for uncategorized videos. Only with mine=true.
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                newest,
                most_viewed,
                featured,
                community_rated,
                community_rated_asc,
              ]
        - name: featured
          in: query
          description: When true, only return featured videos.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a new video entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoInput"
      responses:
        "201":
          description: Created video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/upload-url:
    post:
      operationId: createVideoUploadUrl
      tags: [videos]
      summary: Create a Cloudflare Stream direct upload URL
      responses:
        "200":
          description: One-time upload ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamUploadTicket"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a single video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
    patch:
      operationId: updateVideo
      tags: [videos]
      summary: Update a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /videos/{id}/like:
    post:
      operationId: likeVideo
      tags: [videos]
      summary: Like a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /videos/{id}/rate:
    post:
      operationId: rateVideo
      tags: [videos]
      summary: Rate a video (1-5 stars)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateInput"
      responses:
        "200":
          description: Rating recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateResult"

  /videos/bulk/move:
    post:
      operationId: bulkMoveVideos
      tags: [videos]
      summary: Move multiple videos to a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMoveVideosInput"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"

  /videos/bulk/category:
    post:
      operationId: bulkSetVideoCategory
      tags: [videos]
      summary: Set the category on multiple videos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSetCategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"

  /videos/{id}/comments:
    get:
      operationId: listComments
      tags: [videos]
      summary: Get comments for a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
    post:
      operationId: createComment
      tags: [videos]
      summary: Post a comment on a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ── Collections (media library) ─────────────────────────────────────────────
  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List the current user's collections
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get a collection and its videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCollection
      tags: [collections]
      summary: Update a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Sharing & embedding ─────────────────────────────────────────────────────
  /videos/{id}/share:
    put:
      operationId: updateVideoShare
      tags: [share]
      summary: Enable, disable, or password-protect a video's share link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareSettingsInput"
      responses:
        "200":
          description: Share settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSettings"

  /share/{token}:
    get:
      operationId: getSharedVideo
      tags: [share]
      summary: Get a shared video by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared video metadata. streamUid is omitted when a password is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePublic"
        "404":
          description: Not found

  /share/{token}/unlock:
    post:
      operationId: unlockSharedVideo
      tags: [share]
      summary: Unlock a password-protected shared video (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareUnlockInput"
      responses:
        "200":
          description: Shared video with playback details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePublic"

  /videos/{id}/review-link:
    post:
      operationId: createReviewLink
      tags: [review]
      summary: Create a guest review link for a video group
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewLinkInput"
      responses:
        "201":
          description: Review link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewLink"
  /videos/{id}/review-comments:
    get:
      operationId: listReviewComments
      tags: [review]
      summary: List timestamped review comments for a video
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCommentList"
    post:
      operationId: postOwnerReviewComment
      tags: [review]
      summary: Post an owner review comment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCommentInput"
      responses:
        "201":
          description: Review comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"

  /videos/{id}/review-comments/{commentId}/resolve:
    post:
      operationId: resolveReviewComment
      tags: [review]
      summary: Resolve an owner-visible review comment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved review comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"

  /videos/{id}/approval:
    post:
      operationId: setOwnerApprovalStatus
      tags: [review]
      summary: Set approval status as the owner
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerApprovalInput"
      responses:
        "200":
          description: Updated approval status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResult"

  /review/{token}:
    get:
      operationId: getReviewLink
      tags: [review]
      summary: Resolve a public guest review link
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review link metadata and latest ready video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSession"
    post:
      operationId: unlockReviewLink
      tags: [review]
      summary: Unlock a password-protected review link
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUnlockInput"
      responses:
        "200":
          description: Review session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSession"

  /review/{token}/comments:
    post:
      operationId: postGuestReviewComment
      tags: [review]
      summary: Post a timestamped guest review comment
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestReviewCommentInput"
      responses:
        "201":
          description: Review comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"

  /review/{token}/approval:
    post:
      operationId: setGuestApprovalStatus
      tags: [review]
      summary: Approve the latest ready video or request changes
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Updated approval status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResult"
        "401":
          description: Incorrect password
        "404":
          description: Not found

  # ── Follows ─────────────────────────────────────────────────────────────────
  /follows/{userId}:
    post:
      operationId: followUser
      tags: [follows]
      summary: Follow or unfollow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"

  /follows/{userId}/followers:
    get:
      operationId: listFollowers
      tags: [follows]
      summary: List followers of a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Followers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /follows/{userId}/following:
    get:
      operationId: listFollowing
      tags: [follows]
      summary: List users followed by a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  # ── Feed ────────────────────────────────────────────────────────────────────
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"

  # ── Messages ─────────────────────────────────────────────────────────────────
  /messages:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List inbox conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"

  /messages/{userId}:
    get:
      operationId: getConversation
      tags: [messages]
      summary: Get messages with a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Stats ─────────────────────────────────────────────────────────────────────
  /stats/platform:
    get:
      operationId: getPlatformStats
      tags: [stats]
      summary: Platform-wide stats summary
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /stats/featured:
    get:
      operationId: getFeaturedContent
      tags: [stats]
      summary: Featured filmmakers and videos
      responses:
        "200":
          description: Featured content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedContent"

  # ── Client delivery ───────────────────────────────────────────────────────────
  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List the current user's deliveries
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryList"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Create a client delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"

  /deliveries/{id}:
    get:
      operationId: getDelivery
      tags: [deliveries]
      summary: Get one of the current user's deliveries with its files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: updateDelivery
      tags: [deliveries]
      summary: Update delivery title, message or password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"
    delete:
      operationId: deleteDelivery
      tags: [deliveries]
      summary: Delete a delivery and its files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /deliveries/{id}/files:
    post:
      operationId: addDeliveryFile
      tags: [deliveries]
      summary: Attach an uploaded file to a delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeliveryFileInput"
      responses:
        "201":
          description: File added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"

  /deliveries/{id}/files/{fileId}:
    delete:
      operationId: deleteDeliveryFile
      tags: [deliveries]
      summary: Remove a file from a delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /deliveries/shared/{token}:
    get:
      operationId: getSharedDelivery
      tags: [deliveries]
      summary: Public delivery metadata (files omitted until unlocked)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDelivery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /deliveries/shared/{token}/unlock:
    post:
      operationId: unlockSharedDelivery
      tags: [deliveries]
      summary: Verify the delivery password and return its files
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockDeliveryInput"
      responses:
        "200":
          description: Unlocked delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDelivery"
        "401":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── User schemas ──────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, username, name, profession, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        profession:
          type: string
        location:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        socialLinks:
          type: ["object", "null"]
        credits:
          type: array
          items:
            $ref: "#/components/schemas/UserCredit"
        isAdmin:
          type: boolean
        plan:
          type: string
          description: Subscription tier ("free" or a paid plan such as "creator"/"studio").
        isFollowing:
          type: boolean
        endorsementCount:
          type: integer
        followerCount:
          type: integer
        followingCount:
          type: integer
        videoCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    UserProfile:
      type: object
      required: [user, videos]
      properties:
        user:
          $ref: "#/components/schemas/User"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        credits:
          type: array
          items:
            type: string

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        profession:
          type: string
        location:
          type: string
        bio:
          type: string
        website:
          type: string
        avatarUrl:
          type: string
        coverUrl:
          type: string
        skills:
          type: array
          items:
            type: string
        socialLinks:
          type: object
        credits:
          type: array
          items:
            $ref: "#/components/schemas/UserCredit"

    UserList:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer

    # ── Video schemas ─────────────────────────────────────────────────────────
    Video:
      type: object
      required: [id, userId, title, privacy, viewCount, likeCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        streamUid:
          type: ["string", "null"]
        streamStatus:
          type: ["string", "null"]
        streamProvider:
          type: ["string", "null"]
        streamAssetId:
          type: ["string", "null"]
        streamPlaybackId:
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
        fileSizeBytes:
          type: ["integer", "null"]
          format: int64
        uploadProgressPercent:
          type: integer
        uploadError:
          type: ["string", "null"]
        retryCount:
          type: integer
        reviewGroupId:
          type: ["string", "null"]
        versionNumber:
          type: integer
        approvalStatus:
          type: string
          enum: [pending, approved, changes_requested]
        approvalDecidedAt:
          type: ["string", "null"]
          format: date-time
        approvalDecidedBy:
          type: ["string", "null"]
        privacy:
          type: string
          enum: [public, private, password_protected]
        category:
          $ref: "#/components/schemas/VideoCategory"
        collectionId:
          type: ["integer", "null"]
        shareEnabled:
          type: boolean
        shareToken:
          type: ["string", "null"]
        hasSharePassword:
          type: boolean
        tags:
          type: array
          items:
            type: string
        credits:
          type: ["string", "null"]
        downloadFormats:
          type: array
          items:
            type: string
        isFeatured:
          type: boolean
        viewCount:
          type: integer
        likeCount:
          type: integer
        isLiked:
          type: boolean
        ratingAvg:
          type: number
        ratingCount:
          type: integer
        userRating:
          type: ["integer", "null"]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time

    VideoInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        reviewGroupId:
          type: string
        streamUid:
          type: string
        fileSizeBytes:
          type: integer
          format: int64
        privacy:
          type: string
          enum: [public, private, password_protected]
        tags:
          type: array
          items:
            type: string
        credits:
          type: string
        downloadFormats:
          type: array
          items:
            type: string

    StreamUploadTicket:
      type: object
      required: [uploadURL, uid]
      properties:
        uploadURL:
          type: string
        uid:
          type: string
        uploadMethod:
          type: string
          enum: [post, put]
        streamProvider:
          type: ["string", "null"]
          description: Active streaming provider name (mux, cloudflare) or null when falling back to object storage.

    VideoUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        privacy:
          type: string
          enum: [public, private, password_protected]
        category:
          $ref: "#/components/schemas/VideoCategory"
        collectionId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: string
        credits:
          type: string
        downloadFormats:
          type: array
          items:
            type: string
        uploadProgressPercent:
          type: integer
          minimum: 0
          maximum: 100
        uploadError:
          type: ["string", "null"]
        retryCount:
          type: integer
        streamStatus:
          type: string

    VideoCategory:
      type: string
      enum: [reel, rushes, other]

    BulkMoveVideosInput:
      type: object
      required: [ids, collectionId]
      properties:
        ids:
          type: array
          items:
            type: integer
        collectionId:
          type: ["integer", "null"]

    BulkSetCategoryInput:
      type: object
      required: [ids, category]
      properties:
        ids:
          type: array
          items:
            type: integer
        category:
          $ref: "#/components/schemas/VideoCategory"

    StorageUsage:
      type: object
      required:
        [
          totalBytesUsed,
          videoCount,
          planStorageLimitBytes,
          usagePercent,
          warning,
        ]
      properties:
        totalBytesUsed:
          type: integer
          format: int64
        videoCount:
          type: integer
        planStorageLimitBytes:
          type: integer
          format: int64
        usagePercent:
          type: number
        warning:
          type: boolean

    VideoExport:
      type: object
      required: [videoId, downloadUrl, expiresAt]
      properties:
        videoId:
          type: integer
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    ExportJobInput:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [video, project, account]
        targetId:
          type: string

    ExportJob:
      type: object
      required: [id, ownerId, scope, targetId, status, downloadUrls, createdAt]
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        scope:
          type: string
          enum: [video, project, account]
        targetId:
          type: string
        status:
          type: string
          enum: [processing, ready, error]
        downloadUrls:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    # ── Collection schemas ────────────────────────────────────────────────────
    Collection:
      type: object
      required: [id, userId, parentId, name, path, videoCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        parentId:
          type: ["integer", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        path:
          type: string
        videoCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CollectionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        parentId:
          type: ["integer", "null"]

    CollectionUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        parentId:
          type: ["integer", "null"]

    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"

    CollectionDetail:
      type: object
      required: [collection, videos]
      properties:
        collection:
          $ref: "#/components/schemas/Collection"
        subCollections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        breadcrumbs:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"

    # ── Share / embed schemas ─────────────────────────────────────────────────
    ShareSettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        password:
          type: ["string", "null"]
          description: Set a password, or null to remove the existing one. Omit to leave unchanged.

    ShareSettings:
      type: object
      required: [shareEnabled, hasSharePassword]
      properties:
        shareEnabled:
          type: boolean
        shareToken:
          type: ["string", "null"]
        hasSharePassword:
          type: boolean

    SharePublic:
      type: object
      required: [title, requiresPassword]
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        requiresPassword:
          type: boolean
        streamUid:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]

    ShareUnlockInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    VideoList:
      type: object
      required: [videos, total]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer

    LikeResult:
      type: object
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer

    RateInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5

    RateResult:
      type: object
      required: [ratingAvg, ratingCount, userRating]
      properties:
        ratingAvg:
          type: number
        ratingCount:
          type: integer
        userRating:
          type: ["integer", "null"]

    Comment:
      type: object
      required: [id, videoId, userId, body, createdAt]
      properties:
        id:
          type: integer
        videoId:
          type: integer
        userId:
          type: integer
        body:
          type: string
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    CommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    ReviewLinkInput:
      type: object
      required: [allowDownload, allowComments]
      properties:
        projectId:
          type: integer
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
        password:
          type: string
          minLength: 1
        allowDownload:
          type: boolean
        allowComments:
          type: boolean

    ReviewLink:
      type: object
      required: [token, url, allowDownload, allowComments, hasPassword]
      properties:
        token:
          type: string
        url:
          type: string
        allowDownload:
          type: boolean
        allowComments:
          type: boolean
        hasPassword:
          type: boolean
        expiresAt:
          type: ["string", "null"]
          format: date-time

    ReviewCommentInput:
      type: object
      required: [timecodeSeconds, body]
      properties:
        timecodeSeconds:
          type: number
          minimum: 0
        body:
          type: string
          minLength: 1
        parentCommentId:
          type: ["integer", "null"]

    GuestReviewCommentInput:
      allOf:
        - $ref: "#/components/schemas/ReviewCommentInput"
        - type: object
          required: [authorName]
          properties:
            authorName:
              type: string
              minLength: 1
            password:
              type: string

    ReviewComment:
      type: object
      required:
        [
          id,
          videoId,
          groupId,
          timecodeSeconds,
          body,
          authorType,
          authorName,
          resolved,
          createdAt,
        ]
      properties:
        id:
          type: integer
        videoId:
          type: integer
        groupId:
          type: string
        timecodeSeconds:
          type: number
        body:
          type: string
        authorType:
          type: string
          enum: [owner, guest]
        authorName:
          type: string
        parentCommentId:
          type: ["integer", "null"]
        resolved:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ReviewCommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/ReviewComment"

    ReviewSession:
      type: object
      required:
        [
          title,
          requiresPassword,
          allowDownload,
          allowComments,
          approvalStatus,
          comments,
        ]
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        requiresPassword:
          type: boolean
        allowDownload:
          type: boolean
        allowComments:
          type: boolean
        approvalStatus:
          type: string
          enum: [pending, approved, changes_requested]
        streamProvider:
          type: ["string", "null"]
        streamPlaybackId:
          type: ["string", "null"]
        streamUid:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        downloadFormats:
          type: array
          items:
            type: string
        comments:
          type: array
          items:
            $ref: "#/components/schemas/ReviewComment"

    ReviewUnlockInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    ApprovalInput:
      type: object
      required: [status, authorName]
      properties:
        status:
          type: string
          enum: [approved, changes_requested]
        authorName:
          type: string
          minLength: 1
        password:
          type: string

    OwnerApprovalInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, changes_requested]

    ApprovalResult:
      type: object
      required: [approvalStatus]
      properties:
        approvalStatus:
          type: string
          enum: [approved, changes_requested]

    # ── Follow schemas ────────────────────────────────────────────────────────
    FollowResult:
      type: object
      required: [following, followerCount]
      properties:
        following:
          type: boolean
        followerCount:
          type: integer

    # ── Message schemas ───────────────────────────────────────────────────────
    Conversation:
      type: object
      required: [userId, user, lastMessage, unreadCount, updatedAt]
      properties:
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        lastMessage:
          type: string
        unreadCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    Message:
      type: object
      required: [id, senderId, recipientId, body, read, createdAt]
      properties:
        id:
          type: integer
        senderId:
          type: integer
        recipientId:
          type: integer
        body:
          type: string
        read:
          type: boolean
        attachmentUrl:
          type: ["string", "null"]
          description: Serving URL of an attached file, if any.
        attachmentName:
          type: ["string", "null"]
          description: Original filename of the attachment.
        attachmentType:
          type: ["string", "null"]
          description: MIME type of the attachment.
        attachmentSize:
          type: ["integer", "null"]
          description: Size of the attachment in bytes.
        createdAt:
          type: string
          format: date-time

    MessageInput:
      type: object
      properties:
        body:
          type: string
        attachmentUrl:
          type: string
        attachmentName:
          type: string
        attachmentType:
          type: string
        attachmentSize:
          type: integer

    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    # ── Client delivery schemas ───────────────────────────────────────────────
    DeliveryFile:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        contentType:
          type: ["string", "null"]
        size:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    Delivery:
      type: object
      required: [id, token, title, hasPassword, fileCount, createdAt]
      properties:
        id:
          type: integer
        token:
          type: string
        title:
          type: string
        message:
          type: ["string", "null"]
        hasPassword:
          type: boolean
        fileCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    DeliveryDetail:
      type: object
      required: [id, token, title, hasPassword, createdAt, files]
      properties:
        id:
          type: integer
        token:
          type: string
        title:
          type: string
        message:
          type: ["string", "null"]
        hasPassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryFile"

    DeliveryList:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"

    CreateDeliveryInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        message:
          type: string
        password:
          type: string

    UpdateDeliveryInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        message:
          type: ["string", "null"]
        password:
          type: ["string", "null"]

    AddDeliveryFileInput:
      type: object
      required: [objectPath, name]
      properties:
        objectPath:
          type: string
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer

    PublicDelivery:
      type: object
      required: [title, requiresPassword, unlocked, files]
      properties:
        title:
          type: string
        message:
          type: ["string", "null"]
        requiresPassword:
          type: boolean
        unlocked:
          type: boolean
        downloadKey:
          type: ["string", "null"]
          description: Signed key required to download files when the delivery is password-protected.
        files:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryFile"

    UnlockDeliveryInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # ── Stats schemas ─────────────────────────────────────────────────────────
    PlatformStats:
      type: object
      required: [totalUsers, totalVideos, totalProjects, professionBreakdown]
      properties:
        totalUsers:
          type: integer
        totalVideos:
          type: integer
        totalProjects:
          type: integer
        professionBreakdown:
          type: array
          items:
            type: object
            required: [profession, count]
            properties:
              profession:
                type: string
              count:
                type: integer

    FeaturedContent:
      type: object
      required: [filmmakers, videos]
      properties:
        filmmakers:
          type: array
          items:
            $ref: "#/components/schemas/User"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"

    # ── Credit & Endorsement schemas ───────────────────────────────────────────
    UserCredit:
      type: object
      required: [title, role]
      properties:
        title:
          type: string
          description: Film or project title
        role:
          type: string
          description: Role on the project (e.g. Director, Editor)
        year:
          type: string
          description: Year of the project

    Endorsement:
      type: object
      required: [id, fromUser, text, createdAt]
      properties:
        id:
          type: integer
        fromUser:
          $ref: "#/components/schemas/User"
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    EndorsementList:
      type: object
      required: [endorsements, total]
      properties:
        endorsements:
          type: array
          items:
            $ref: "#/components/schemas/Endorsement"
        total:
          type: integer
        myEndorsement:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Endorsement"

    CreateEndorsement:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500

    AdminFeaturedToggle:
      type: object
      required: [featured]
      properties:
        featured:
          type: boolean
